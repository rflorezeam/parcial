services:
  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - libros-net

  app:
    build: .
    container_name: libros-parcial
    depends_on:
      - mongo
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - libros-net

volumes:
  mongodb_data:

networks:
  libros-net:
